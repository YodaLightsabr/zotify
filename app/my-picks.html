<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My picks · Zotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@cds/city@1.1.0/css/bundles/default.min.css" rel="stylesheet">
    <link href="/base.css" rel="stylesheet">
    <link href="/pick-history.css" rel="stylesheet">
    <style>
        header, main {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        header { display: flex; align-items: center; justify-content: space-between; }
        header a.back { color: var(--placeholder); font-size: 0.9rem; }

        main { padding-top: 0; }

        h1 {
            font-family: "Jua", system-ui, sans-serif;
            font-weight: 400;
            font-size: 1.8rem;
            margin: 0;
        }

        .intro { color: var(--muted); margin: 6px 0 24px; font-size: 0.95rem; }

        .error { color: var(--error); }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="/"><div class="logo-mark">♪</div> Zotify</a>
        <a class="back" href="/">Back to Zotify</a>
    </header>

    <main>
        <h1>My picks</h1>
        <p class="intro" id="intro">Everything you've queued with Zotify. Request one again with a click.</p>
        <div id="picks"><span class="spinner small"></span></div>
    </main>

    <script src="/pick-history.js"></script>
    <script>
        const picksList = PickHistory.create(document.getElementById("picks"), {
            emptyText: "You haven't queued anything with Zotify yet. Search for a song on the homepage to get started.",
            onRequested: () => loadPicks()
        });

        async function loadPicks() {
            try {
                const response = await fetch("/api/my-picks");

                // Sessions can end while the page is open
                if (response.status === 401) return location.assign(`/login?${new URLSearchParams({ next: "/my-picks" })}`);
                if (response.status === 403) return location.assign(`/beta?${new URLSearchParams({ next: "/my-picks" })}`);
                if (!response.ok) throw new Error(`Couldn't load your picks (${response.status})`);

                const picks = await response.json();
                if (picks.length) document.getElementById("intro").textContent = `${picks.length} song${picks.length === 1 ? "" : "s"} you've queued with Zotify. Request one again with a click.`;
                picksList.render(picks);
            } catch (error) {
                const message = document.createElement("p");
                message.className = "error";
                message.textContent = error.message;
                document.getElementById("picks").replaceChildren(message);
            }
        }

        loadPicks();
    </script>
</body>
</html>
