<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Zotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@cds/city@1.1.0/css/bundles/default.min.css" rel="stylesheet">
    <link href="/base.css" rel="stylesheet">
    <link href="/card.css" rel="stylesheet">
</head>
<body>
    <main>
        <div class="card">
            <a class="logo" href="/"><div class="logo-mark">♪</div> Zotify</a>
            <h1>Sign in</h1>
            <p class="subtitle">Sign in with your UCInetID or email to search and queue songs.</p>

            <form id="netid-form" novalidate>
                <label for="netid">UCInetID or email</label>
                <div class="field" id="netid-field">
                    <!-- Accepts a UCInetID like "panteater" (which gets @uci.edu), or any full email address during the testing phase -->
                    <input id="netid" name="netid" type="text" placeholder="panteater" required
                        pattern="[A-Za-z0-9][A-Za-z0-9._\-]*|[^\s@]+@[^\s@]+\.[^\s@]+"
                        title="Your UCInetID, like panteater, or your email address"
                        autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
                    <span class="suffix" aria-hidden="true">@uci.edu</span>
                </div>
                <p class="message" id="netid-message" role="alert"></p>
                <button class="primary" type="submit" id="netid-submit">Send code</button>
            </form>

            <form id="code-form" hidden novalidate>
                <label for="code">Login code</label>
                <p class="hint" id="code-hint"></p>
                <div class="field">
                    <input id="code" name="code" class="code-input" type="text" inputmode="numeric" placeholder="000000"
                        required pattern="[0-9]{6}" maxlength="6" title="The 6-digit code we sent you" autocomplete="one-time-code">
                </div>
                <p class="message" id="code-message" role="alert"></p>
                <button class="primary" type="submit" id="code-submit">Sign in</button>
                <div class="links">
                    <button type="button" id="change-netid">Use a different email</button>
                    <button type="button" id="resend">Send a new code</button>
                </div>
            </form>
        </div>
    </main>

    <footer id="now-playing" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span id="now-playing-text">Checking what's playing…</span></footer>

    <script>
        const netIdForm = document.getElementById("netid-form");
        const netIdInput = document.getElementById("netid");
        const netIdField = document.getElementById("netid-field");
        const netIdMessage = document.getElementById("netid-message");
        const codeForm = document.getElementById("code-form");
        const codeInput = document.getElementById("code");
        const codeMessage = document.getElementById("code-message");

        // Only send people back to a page on this site
        const next = (() => {
            const value = new URLSearchParams(location.search).get("next");
            return value && value.startsWith("/") && !value.startsWith("//") ? value : "/";
        })();

        let netId = "";

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return { response, data: await response.json().catch(() => null) };
        }

        function setBusy(button, label) {
            button.disabled = true;
            button.dataset.label ??= button.textContent;
            const spinner = document.createElement("span");
            spinner.className = "spinner small";
            button.replaceChildren(spinner, label);
        }

        function setIdle(button) {
            button.disabled = false;
            button.textContent = button.dataset.label;
        }

        // Typing or pasting a full address drops the "@uci.edu" suffix and gives the input the whole row
        function updateNetIdField() {
            netIdField.classList.toggle("full-address", netIdInput.value.trim().includes("@"));
        }

        netIdInput.addEventListener("input", () => {
            updateNetIdField();
            netIdMessage.textContent = "";
        });

        async function sendCode(button) {
            setBusy(button, "Sending…");
            netIdMessage.textContent = codeMessage.textContent = "";

            try {
                const { response, data } = await postJson("/api/auth/request-code", { netid: netId });
                if (!response.ok) throw new Error(data?.error ?? `Couldn't send a code (${response.status})`);

                document.getElementById("code-hint").textContent = data.delivery === "console"
                    ? `Enter the 6-digit code for ${data.email}. Email isn't set up, so it's printed in the server console.`
                    : `We emailed a 6-digit code to ${data.email}. It may take a minute to arrive.`;
                netIdForm.hidden = true;
                codeForm.hidden = false;
                codeInput.value = "";
                codeInput.focus();
                return true;
            } catch (error) {
                (codeForm.hidden ? netIdMessage : codeMessage).textContent = error.message;
                return false;
            } finally {
                setIdle(button);
            }
        }

        netIdForm.addEventListener("submit", event => {
            event.preventDefault();
            updateNetIdField();
            if (!netIdForm.reportValidity()) return;

            netId = netIdInput.value.trim();
            sendCode(document.getElementById("netid-submit"));
        });

        codeInput.addEventListener("input", () => {
            // Keep only digits, so pasting "123 456" works
            codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
            codeMessage.textContent = "";
        });

        codeForm.addEventListener("submit", async event => {
            event.preventDefault();
            if (!codeForm.reportValidity()) return;

            const button = document.getElementById("code-submit");
            setBusy(button, "Signing in…");

            try {
                const { response, data } = await postJson("/api/auth/verify", { netid: netId, code: codeInput.value });
                if (!response.ok) throw new Error(data?.error ?? `Couldn't sign in (${response.status})`);

                goOn(data.approved);
            } catch (error) {
                codeMessage.textContent = error.message;
                setIdle(button);
                codeInput.select();
            }
        });

        document.getElementById("change-netid").addEventListener("click", () => {
            codeForm.hidden = true;
            netIdForm.hidden = false;
            netIdInput.focus();
            netIdInput.select();
        });

        document.getElementById("resend").addEventListener("click", event => sendCode(event.currentTarget));

        // Approved people go back where they came from. Everyone else sees the private beta screen,
        // except on an invite link, which lets them in itself once they're signed in
        function goOn(approved) {
            location.replace(approved || next.startsWith("/invite/") ? next : `/beta?${new URLSearchParams({ next })}`);
        }

        // Already signed in? Skip ahead
        fetch("/api/auth/me")
            .then(async response => { if (response.ok) goOn((await response.json()).approved); })
            .catch(() => {});

        // Links that sent people here with a problem, like an expired sign-in link
        const linkError = new URLSearchParams(location.search).get("error");
        if (linkError) netIdMessage.textContent = linkError;

    </script>
    <script src="/now-playing.js"></script>
</body>
</html>
