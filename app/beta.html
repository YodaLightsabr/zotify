<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private beta · Zotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@cds/city@1.1.0/css/bundles/default.min.css" rel="stylesheet">
    <link href="/base.css" rel="stylesheet">
    <link href="/card.css" rel="stylesheet">
    <style>
        .option + .option {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .option h2 {
            margin: 0 0 6px;
            font-size: 1rem;
        }

        .status {
            margin: 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bg);
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status strong { color: var(--text); }

        .code-field input { text-transform: uppercase; letter-spacing: 0.15em; }

        .signed-in {
            margin: 20px 0 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .signed-in button {
            padding: 0;
            border: none;
            background: none;
            color: var(--placeholder);
            text-decoration: underline;
            cursor: pointer;
            font-size: inherit;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <a class="logo" href="/"><div class="logo-mark">♪</div> Zotify</a>
            <h1>Zotify is in private beta</h1>
            <p class="subtitle">We're letting people in a few at a time. Ask for an invitation, or use an invite code if you have one.</p>

            <section class="option" aria-labelledby="request-title">
                <h2 id="request-title">Ask for an invitation</h2>
                <div id="request-area"><span class="spinner small"></span></div>
            </section>

            <section class="option" aria-labelledby="code-title">
                <form id="code-form" novalidate>
                    <label for="invite-code" id="code-title">Have an invite code?</label>
                    <div class="field code-field">
                        <input id="invite-code" name="code" type="text" placeholder="ABCD2345" required
                            autocomplete="off" autocapitalize="characters" spellcheck="false">
                    </div>
                    <p class="message" id="code-message" role="alert"></p>
                    <button class="primary" type="submit" id="code-submit">Join with code</button>
                </form>
            </section>

            <p class="signed-in" id="signed-in"></p>
        </div>
    </main>

    <footer id="now-playing" aria-live="polite"><span class="live-dot" aria-hidden="true"></span><span id="now-playing-text">Checking what's playing…</span></footer>

    <script>
        const requestArea = document.getElementById("request-area");
        const codeMessage = document.getElementById("code-message");

        // Only send people on to a page on this site
        const next = (() => {
            const value = new URLSearchParams(location.search).get("next");
            return value && value.startsWith("/") && !value.startsWith("//") ? value : "/";
        })();

        function el(tag, props = {}, children = []) {
            const node = Object.assign(document.createElement(tag), props);
            node.append(...children);
            return node;
        }

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return { response, data: await response.json().catch(() => null) };
        }

        function setBusy(button, label) {
            button.disabled = true;
            button.dataset.label ??= button.textContent;
            button.replaceChildren(el("span", { className: "spinner small" }), label);
        }

        function setIdle(button) {
            button.disabled = false;
            button.textContent = button.dataset.label;
        }

        const date = timestamp => new Date(timestamp).toLocaleDateString(undefined, { month: "short", day: "numeric" });

        // What the request option shows depends on whether they've already asked
        function renderRequest(request) {
            if (request?.status === "pending") {
                requestArea.replaceChildren(el("p", { className: "status" }, [
                    el("strong", { textContent: "Request sent." }),
                    ` You asked on ${date(request.requestedAt)}. We'll email you when you're in.`
                ]));
                return;
            }

            if (request?.status === "rejected") {
                requestArea.replaceChildren(el("p", { className: "status", textContent: "Your request wasn't approved this time. An invite code still works if you get one." }));
                return;
            }

            const button = el("button", { className: "primary", type: "button", textContent: "Request an invitation" });
            const message = el("p", { className: "message", role: "alert" });

            button.addEventListener("click", async () => {
                setBusy(button, "Sending…");

                try {
                    const { response, data } = await postJson("/api/beta/request", {});
                    if (!response.ok) throw new Error(data?.error ?? `Couldn't send your request (${response.status})`);
                    renderRequest(data.request);
                } catch (error) {
                    message.textContent = error.message;
                    setIdle(button);
                }
            });

            requestArea.replaceChildren(
                el("p", { className: "hint", textContent: "You can only ask once, so we'll let you know by email." }),
                button,
                message
            );
        }

        document.getElementById("code-form").addEventListener("submit", async event => {
            event.preventDefault();
            const input = document.getElementById("invite-code");
            if (!event.target.reportValidity()) return;

            const button = document.getElementById("code-submit");
            setBusy(button, "Checking…");
            codeMessage.textContent = "";

            try {
                const { response, data } = await postJson("/api/beta/redeem", { code: input.value });
                if (!response.ok) throw new Error(data?.error ?? `Couldn't use that code (${response.status})`);
                location.replace(next === "/" ? "/?welcome=1" : next);
            } catch (error) {
                codeMessage.textContent = error.message;
                setIdle(button);
            }
        });

        async function load() {
            const response = await fetch("/api/auth/me").catch(() => null);
            if (!response?.ok) return location.replace(`/login?${new URLSearchParams({ next: location.pathname + location.search })}`);

            const me = await response.json();
            if (me.approved) return location.replace(next);

            renderRequest(me.request);

            const signOut = el("button", { type: "button", textContent: "Sign out" });
            signOut.addEventListener("click", async () => {
                await postJson("/api/auth/logout", {}).catch(() => {});
                location.replace("/");
            });
            document.getElementById("signed-in").replaceChildren(`Signed in as ${me.email.replace(/@uci\.edu$/i, "")}. `, signOut);
        }

        // An invite link that didn't work sends people here with the reason
        const linkError = new URLSearchParams(location.search).get("error");
        if (linkError) codeMessage.textContent = linkError;

        load();
    </script>
    <script src="/now-playing.js"></script>
</body>
</html>
