<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@cds/city@1.1.0/css/bundles/default.min.css" rel="stylesheet">
    <link href="/base.css" rel="stylesheet">
    <style>
        .hero h1 {
            font-family: "Jua", system-ui, sans-serif;
            font-weight: 400;
        }

        .account {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            font-size: 0.9rem;
        }

        .account-email {
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-link {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: none;
            color: var(--text);
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
        }

        .account-link:hover { border-color: var(--accent); }

        .welcome-note {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font-weight: 700;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            transition: padding-top 0.3s ease;
            padding-top: 16vh;
        }

        main.has-results { padding-top: 24px; }

        .hero { text-align: center; margin-bottom: 28px; }

        .hero h1 {
            font-size: clamp(2rem, 6vw, 3.25rem);
            line-height: 1.1;
            margin: 0 0 12px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p { color: var(--muted); margin: 0; font-size: 1.05rem; }

        main.has-results .hero, main.has-results .recent { display: none; }

        main:not(.has-results) #output { display: none; }

        .recent { margin-top: 40px; }

        .recent h2 {
            font-family: "Jua", system-ui, sans-serif;
            font-weight: 400;
            font-size: 1.3rem;
            margin: 0;
        }

        .recent .message { margin-top: 16px; }

        .queue-group { margin-top: 20px; }

        .queue-group h3 {
            margin: 0 0 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .queue-group .results { margin-top: 0; }

        .song.zotify { border-color: var(--accent); }

        .now-playing { flex-wrap: wrap; }

        .votes {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            padding-right: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
        }

        .vote.up.active { color: var(--accent); }
        .vote.down.active { color: var(--error); }

        .progress-row {
            flex-basis: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Clarity City has no tabular figures, so numbers that update use the system font to keep a steady width */
        .progress-row, .votes {
            font-family: system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            flex: 1;
            height: 6px;
            border-radius: 999px;
            background: var(--surface-2);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 1s linear;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 6px 6px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(254, 204, 7, 0.2), 0 10px 40px rgba(0, 0, 0, 0.35);
        }

        .search svg { flex-shrink: 0; color: var(--muted); }

        .search input {
            flex: 1;
            min-width: 0;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1.1rem;
            padding: 12px 4px;
        }

        .search input::placeholder { color: var(--placeholder); opacity: 1; }

        .search button {
            border: none;
            border-radius: 999px;
            padding: 12px 22px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--on-accent);
            background: var(--accent);
            cursor: pointer;
        }

        .search button:disabled { opacity: 0.6; cursor: default; }

        .venues {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .venues input { position: absolute; opacity: 0; pointer-events: none; }

        .venues label {
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }

        .venues input:checked + label {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(254, 204, 7, 0.12);
        }

        .venues input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

        .message {
            text-align: center;
            color: var(--muted);
            margin-top: 32px;
        }

        .results {
            list-style: none;
            padding: 0;
            margin: 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            position: relative;
        }

        .song * {
            z-index: 2;
            position: relative;
        }

        .cover {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            flex-shrink: 0;
            object-fit: cover;
            background: var(--surface-2);
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .cover-backdrop {
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
            width: 70%;
            -webkit-mask-image: linear-gradient(to right, black, transparent);
            mask-image: linear-gradient(to right, black, transparent);
            filter: blur(50px);
            pointer-events: none;
            height: 100%;
            border-radius: 10px;
            flex-shrink: 0;
            object-fit: cover;
            background: var(--surface-2);
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .cover-button {
            padding: 0;
            border: none;
            background: none;
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cover-button:hover .cover { box-shadow: 0 0 0 2px var(--accent); }
        .cover-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .vote-dialog {
            width: min(400px, calc(100vw - 32px));
            padding: 20px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .vote-dialog::backdrop { background: rgba(0, 20, 40, 0.7); }

        .vote-dialog-song {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .vote-dialog-song h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .vote-dialog-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .vote-dialog-status:empty { display: none; }

        .vote-dialog-body:not(:empty) {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .vote-count-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .vote-count-label .spinner { margin: 0; }

        .vote-dialog-body input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .downvote-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .downvote-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .downvote-note {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .downvote-note .spinner { margin: 0; }

        .override-reason {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border: 1px solid var(--error);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
        }

        .override-reason::placeholder { color: var(--placeholder); }
        .downvote-note.error-text { color: var(--error); }

        .queue-btn.danger { color: var(--error); border-color: var(--error); flex-shrink: 0; }
        .queue-btn.danger.confirming { color: var(--on-accent); background: var(--error); }
        .queue-btn.danger:disabled:not(.busy) { opacity: 0.5; }

        .vote-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .meta { flex: 1; min-width: 0; }

        .meta .name, .meta .artist {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta .name { font-weight: 600; }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .badge {
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--on-accent);
            background: var(--accent);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .playlist-heading { margin-top: 24px; }

        .playlist-heading h2 {
            font-family: "Jua", system-ui, sans-serif;
            font-weight: 400;
            font-size: 1.3rem;
            margin: 0;
        }

        .playlist-heading p, .playlist-progress {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 4px 0 0;
        }

        .playlist-progress { margin: 12px 0; }

        .track-status {
            flex-shrink: 0;
            min-width: 22px;
            display: grid;
            place-items: center;
            padding-right: 6px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .track-status[data-state="found"] { color: var(--accent); }
        .track-status[data-state="failed"], .song > .track-status:not([data-state]) { color: var(--error); }

        .track-status[data-state="retrying"] {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge.elsewhere {
            color: var(--accent);
            background: none;
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .badge.cooldown {
            color: var(--muted);
            background: none;
            box-shadow: inset 0 0 0 1px var(--muted);
        }
        .meta .artist { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

        .meta .error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .meta .error:empty { display: none; }

        .queue-btn {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .queue-btn:hover:not(:disabled) { border-color: var(--accent); }
        .queue-btn:disabled { cursor: default; color: var(--muted); }
        .queue-btn.done { color: var(--accent); border-color: var(--accent); }

        .queue-btn.busy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }

        .queue-btn .spinner { margin: 0; }

        .queue-btn.boost {
            color: var(--on-accent);
            background: var(--accent);
            border-color: var(--accent);
        }

        /* The gold style would otherwise hide that it's disabled; busy buttons stay bright so their spinner is visible */
        .queue-btn.boost:disabled:not(.busy) { opacity: 0.5; }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding: 20px;
        }

        @media (max-width: 520px) {
            .search { padding-left: 14px; }
            .search button { padding: 12px 16px; }
            .search svg { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="/" id="home-link"><div class="logo-mark">♪</div> Zotify</a>
        <div class="account" id="account"></div>
    </header>

    <main id="main">
        <section class="hero">
            <h1>Pick the <span>soundtrack</span>.</h1>
            <p>Zot your song into the queue.</p>
        </section>

        <form class="search" id="search-form" role="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input id="query" type="search" name="q" placeholder="Search songs, artists…" autocomplete="off" autofocus aria-label="Search songs">
            <button type="submit" id="search-btn">Search</button>
        </form>

        <div class="venues" role="radiogroup" aria-label="Venue">
            <input type="radio" name="venue" id="venue-anteatery" value="anteatery" checked form="search-form">
            <label for="venue-anteatery">Anteatery</label>
            <input type="radio" name="venue" id="venue-brandywine" value="brandywine" form="search-form">
            <label for="venue-brandywine">Brandywine</label>
        </div>

        <section class="recent" aria-labelledby="recent-title">
            <h2 id="recent-title">Up next</h2>
            <div id="recent-list" aria-live="polite"></div>
        </section>

        <div id="output" aria-live="polite"></div>
    </main>

    <dialog id="vote-dialog" class="vote-dialog" aria-labelledby="vote-dialog-title"></dialog>

    <footer>Made with ♪ by Anteaters</footer>

    <script>
        const main = document.getElementById("main");
        const form = document.getElementById("search-form");
        const queryInput = document.getElementById("query");
        const searchBtn = document.getElementById("search-btn");
        const output = document.getElementById("output");
        const recentList = document.getElementById("recent-list");

        let lastQuery = "";
        let searchId = 0;
        let queueId = 0;
        let nowPlayingTimer = null;

        const QUEUE_REFRESH_MS = 20_000;
        const getVenueLabel = () => document.querySelector('input[name="venue"]:checked + label').textContent;

        const getVenue = () => document.querySelector('input[name="venue"]:checked').value;

        function el(tag, props = {}, children = []) {
            const node = Object.assign(document.createElement(tag), props);
            node.append(...children);
            return node;
        }

        function timeAgo(timestamp) {
            const minutes = Math.max(0, Math.round((Date.now() - timestamp) / 60000));
            if (minutes < 1) return "just now";
            if (minutes < 60) return `${minutes} min ago`;
            return `${Math.floor(minutes / 60)} hr ${minutes % 60} min ago`;
        }

        function queuedBadge(queuedAt) {
            const title = queuedAt ? `Queued with Zotify ${timeAgo(queuedAt)}` : "In the queue";
            return el("span", { className: "badge", textContent: "Queued", title });
        }

        function cooldownBadge(song) {
            // Whichever Zotify did most recently: queued it, or boosted someone else's request
            const boosted = song.boostedAt && (!song.queuedAt || song.boostedAt > song.queuedAt);
            const title = boosted
                ? `Boosted with Zotify ${timeAgo(song.boostedAt)} and already played`
                : `Queued with Zotify ${timeAgo(song.queuedAt)} and already played`;

            return el("span", { className: "badge cooldown", textContent: "Cooldown", title });
        }

        function showMessage(text, target = output) {
            target.replaceChildren(el("p", { className: "message", textContent: text }));
        }

        function songCover(song) {
            const coverSrc = song.cover ?? song.album?.cover?.src;
            return coverSrc
                ? el("img", { className: "cover", src: coverSrc, alt: "", loading: "lazy" })
                : el("div", { className: "cover", textContent: "♪" });
        }

        // Songs in the queue have a pick, and clicking their cover opens the vote popup
        function votableCover(song, venue) {
            if (!song.pickId) return songCover(song);

            const button = el("button", {
                className: "cover-button",
                type: "button",
                title: "Add votes",
                ariaLabel: `Add votes for ${song.name}`
            }, [songCover(song)]);

            button.addEventListener("click", () => openVoteDialog(song, venue));
            return button;
        }

        const voteDialog = document.getElementById("vote-dialog");
        let voteDialogId = 0;

        const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;

        function downvoteSection(song, venue, isCurrent) {
            const note = el("p", { className: "downvote-note" }, [el("span", { className: "spinner small" }), "Checking…"]);
            const button = el("button", { type: "button", className: "queue-btn danger", textContent: "Downvote ×6", disabled: true });
            const section = el("div", { className: "downvote-section" }, [
                el("div", { className: "downvote-text" }, [el("div", { className: "downvote-title", textContent: "Admin" }), note]),
                button
            ]);

            const showResult = (text, isError = false) => {
                note.textContent = text;
                note.classList.toggle("error-text", isError);
            };

            // Overriding karma protection needs a reason, which the server records
            const reasonInput = el("input", {
                type: "text", className: "override-reason", maxLength: 200,
                placeholder: "Why? e.g. 4 hours of 30-minute tracks", ariaLabel: "Reason for overriding karma protection"
            });
            let mode = "blocked";

            (async () => {
                try {
                    const response = await fetch(`/api/admin/downvote?${new URLSearchParams({ pickId: song.pickId, venue })}`);
                    const check = await response.json().catch(() => null);
                    if (!response.ok) throw new Error(check?.error ?? `Couldn't check this song (${response.status})`);
                    if (!isCurrent()) return;

                    button.textContent = `Downvote ×${check.count}`;

                    // Karma protection is the only thing in the way, so an admin can override it with a reason
                    if (!check.allowed && check.overridable) {
                        showResult(check.reason);
                        mode = "override";
                        button.textContent = "Override…";
                        button.disabled = false;
                        return;
                    }

                    if (!check.allowed) {
                        showResult(check.reason);
                        return;
                    }

                    const karma = check.karma > 0 ? `+${check.karma}` : String(check.karma);
                    showResult(`${karma} karma (${check.upvotes} up, ${check.downvotes} down). Only for meme songs.`);
                    mode = "allowed";
                    button.disabled = false;
                } catch (error) {
                    if (isCurrent()) showResult(error.message, true);
                }
            })();

            reasonInput.addEventListener("input", () => button.disabled = reasonInput.value.trim().length < 3);

            // Allowed songs: the first click asks for confirmation and the second downvotes.
            // Protected songs: the first click asks for a reason, and the button only works once there is one
            button.addEventListener("click", async () => {
                if (mode === "allowed") {
                    mode = "confirming";
                    button.textContent = `Confirm downvote ×6`;
                    button.classList.add("confirming");
                    return;
                }

                if (mode === "override") {
                    mode = "overriding";
                    note.after(reasonInput);
                    button.textContent = "Downvote ×6 anyway";
                    button.classList.add("confirming");
                    button.disabled = true;
                    reasonInput.focus();
                    return;
                }

                const overrideReason = mode === "overriding" ? reasonInput.value.trim() : undefined;
                reasonInput.disabled = true;
                setButtonBusy(button, "Downvoting…");

                try {
                    const { response, data } = await postJson("/api/admin/downvote", { pickId: song.pickId, venue, overrideReason });
                    if (!response.ok) throw new Error(data?.error ?? `Downvoting failed (${response.status})`);
                    if (!isCurrent()) return;

                    showResult(`Downvoted ${plural(data.confirmed ?? data.requested, "time")}${overrideReason ? " (override recorded)" : ""}.${data.missing?.length ? ` ${plural(data.missing.length, "vote")} didn't go through.` : ""}`);
                    reasonInput.remove();
                    button.classList.remove("busy", "confirming");
                    button.textContent = "Downvoted ✓";

                    if (isHome()) loadQueue({ quiet: true });
                } catch (error) {
                    if (!isCurrent()) return;
                    showResult(error.message, true);
                    button.classList.remove("busy", "confirming");
                    button.textContent = "Downvote ×6";
                    button.disabled = true;
                }
            });

            return section;
        }

        async function openVoteDialog(song, venue) {
            if (!currentUser || !currentUser.approved) {
                goToLogin();
                return;
            }

            const id = ++voteDialogId;
            const isCurrent = () => id === voteDialogId && voteDialog.open;

            const status = el("p", { className: "vote-dialog-status" });
            const body = el("div", { className: "vote-dialog-body" });
            const actions = el("div", { className: "vote-dialog-actions" });
            const closeButton = label => {
                const button = el("button", { type: "button", className: "queue-btn", textContent: label });
                button.addEventListener("click", () => voteDialog.close());
                return button;
            };

            voteDialog.replaceChildren(
                el("div", { className: "vote-dialog-song" }, [
                    songCover(song),
                    el("div", { className: "meta" }, [
                        el("h2", { id: "vote-dialog-title", className: "name", textContent: song.name }),
                        el("div", { className: "artist", textContent: song.artist })
                    ])
                ]),
                status,
                body,
                actions
            );

            // Admins can mass-downvote meme songs that aren't Zotify's; the server decides whether this one qualifies
            if (currentUser.admin && !song.zotify && !song.queuedByZotify) voteDialog.append(downvoteSection(song, venue, isCurrent));

            // The slider and its label are there from the start, so nothing shifts once the votes are checked
            const slider = el("input", { type: "range", min: "1", max: "1", step: "1", value: "1", id: "vote-count", disabled: true });
            const sliderLabel = el("label", { htmlFor: "vote-count", className: "vote-count-label" }, [
                el("span", { className: "spinner small" }),
                "Checking votes…"
            ]);

            // Shown disabled until the votes are checked, for the same reason
            const submit = el("button", { type: "button", className: "queue-btn boost", textContent: "Add votes", disabled: true });

            body.replaceChildren(sliderLabel, slider);
            actions.replaceChildren(closeButton("Cancel"), submit);
            voteDialog.showModal();

            let capacity;

            try {
                const response = await fetch(`/api/vote-capacity?${new URLSearchParams({ pickId: song.pickId, venue })}`);
                capacity = await response.json().catch(() => null);
                if (!response.ok) throw new Error(capacity?.error ?? `Couldn't check votes (${response.status})`);
            } catch (err) {
                if (!isCurrent()) return;
                body.replaceChildren();
                status.textContent = err.message || "Couldn't check this song's votes.";
                actions.replaceChildren(closeButton("Close"));
                return;
            }

            if (!isCurrent()) return;

            // Every one of our accounts has voted, so there's nothing to add and no slider
            if (capacity.available === 0) {
                body.replaceChildren();
                status.textContent = `All ${capacity.total} of our accounts have already voted for this song.`;
                actions.replaceChildren(closeButton("Close"));
                return;
            }

            // Stays at 1 so the thumb doesn't jump when the votes load
            slider.max = String(capacity.available);
            slider.value = "1";
            slider.disabled = false;

            const updateLabel = () => sliderLabel.textContent = `Add ${plural(Number(slider.value), "vote")}`;
            slider.addEventListener("input", updateLabel);
            updateLabel();

            submit.disabled = false;

            submit.addEventListener("click", async () => {
                slider.disabled = true;
                setButtonBusy(submit, "Voting…");

                try {
                    const { response, data } = await postJson("/api/vote", {
                        pickId: song.pickId,
                        venue,
                        count: Number(slider.value),
                        song: { name: song.name, artist: song.artist }
                    });
                    if (!response.ok) throw new Error(data?.error ?? `Voting failed (${response.status})`);
                    if (!isCurrent()) return;

                    const added = data.confirmed ?? data.requested;
                    status.textContent = data.confirmed === null
                        ? `Sent ${plural(data.requested, "vote")}, but couldn't confirm them.`
                        : `Added ${plural(added, "vote")}.${data.missing?.length ? ` ${plural(data.missing.length, "vote")} didn't go through.` : ""}`;
                    body.replaceChildren();
                    actions.replaceChildren(closeButton("Done"));

                    // Show the new counts on the Up next screen
                    if (isHome()) loadQueue({ quiet: true });
                } catch (err) {
                    if (!isCurrent()) return;
                    status.textContent = err.message || "Voting failed. Please try again.";
                    slider.disabled = false;
                    submit.classList.remove("busy");
                    submit.disabled = false;
                    submit.textContent = "Add votes";
                }
            });
        }

        function songBackdrop(song) {
            const coverSrc = song.cover ?? song.album?.cover?.src;
            return coverSrc
                ? el("img", { className: "cover-backdrop", src: coverSrc, alt: "", loading: "lazy" })
                : el("div", { className: "cover-backdrop", textContent: "" });
        }

        function markButtonQueued(button) {
            button.textContent = "Queued ✓";
            button.classList.add("done");
            button.disabled = true;
        }

        const VENUE_LABELS = { anteatery: "Anteatery", brandywine: "Brandywine" };

        function resultRow(song, venue) {
            const requestable = song.requestable !== false;
            const button = el("button", {
                className: "queue-btn",
                textContent: requestable ? "Queue" : "Unavailable",
                disabled: !requestable
            });

            const error = el("div", { className: "error", role: "alert" });
            const titleRow = el("div", { className: "title-row" }, [
                el("div", { className: "name", textContent: song.name })
            ]);

            if (!requestable && song.availableAt) {
                const venueLabel = VENUE_LABELS[song.availableAt] ?? song.availableAt;
                titleRow.append(el("span", {
                    className: "badge elsewhere",
                    textContent: `Available at ${venueLabel}`,
                    title: `Not requestable here, but you can request it at ${venueLabel}`
                }));
            }

            // Someone else queued it, so all our accounts can upvote it instead
            const boostable = song.status === "queued" && song.pickId && song.queuedByZotify === false;

            if (boostable && song.boostedAt) {
                titleRow.append(queuedBadge(song.queuedAt));
                button.textContent = "Boosted ✓";
                button.classList.add("done");
                button.disabled = true;
                button.title = `Boosted ${timeAgo(song.boostedAt)}`;
            } else if (boostable) {
                titleRow.append(queuedBadge(song.queuedAt));
                button.textContent = "Boost";
                button.classList.add("boost");
                button.title = "Upvote it with every account";
            } else if (song.status === "queued") {
                titleRow.append(queuedBadge(song.queuedAt));
                markButtonQueued(button);
            } else if (song.status === "cooldown") {
                titleRow.append(cooldownBadge(song));
                button.textContent = "Cooldown";
                button.disabled = true;
            }

            button.addEventListener("click", () => boostable ? boostSong(song, venue, button, error) : queueSong(song, venue, button, error, titleRow));

            return el("li", { className: "song" }, [
                votableCover(song, venue),
                songBackdrop(song),
                el("div", { className: "meta" }, [
                    titleRow,
                    el("div", { className: "artist", textContent: song.artist }),
                    error
                ]),
                button
            ]);
        }

        // Which group a search result belongs in. Queued songs are already waiting, so like cooldown songs they can't be queued again
        function resultGroup(song) {
            if (song.requestable === false) return song.availableAt ? "elsewhere" : "unavailable";
            if (song.status === "queued" && song.queuedByZotify === false) return "others";
            if (song.status === "queued" || song.status === "cooldown") return "cooldown";
            return "available";
        }

        function renderResults(songs, venue, { heading, notFound = [] } = {}) {
            if (!songs.length && !notFound.length) {
                showMessage("No songs found. Try a different search.");
                return;
            }

            const otherVenue = venue === "anteatery" ? "brandywine" : "anteatery";
            const groups = [
                ["cooldown", "On cooldown"],
                ["others", "Requested by others"],
                ["available", "Available to play"],
                ["elsewhere", `Only available at ${VENUE_LABELS[otherVenue]}`],
                ["unavailable", "Unavailable anywhere"]
            ];

            const sections = groups
                .map(([key, title]) => [title, songs.filter(song => resultGroup(song) === key).map(song => resultRow(song, venue))])
                .concat([["Not found", notFound.map(track => notFoundRow(track))]])
                .filter(([, rows]) => rows.length)
                .map(([title, rows]) => queueGroup(`${title} (${rows.length})`, [el("ul", { className: "results" }, rows)]));

            output.replaceChildren(...(heading ? [heading] : []), ...sections);
        }

        // A playlist track Rockbot had no match for, shown from Spotify's details
        function notFoundRow(track) {
            return el("li", { className: "song" }, [
                songCover({}),
                el("div", { className: "meta" }, [
                    el("div", { className: "title-row" }, [el("div", { className: "name", textContent: track.title })]),
                    el("div", { className: "artist", textContent: track.artist })
                ]),
                // Distinguishes "Rockbot had no match" from "we couldn't ask Rockbot"
                ...(track.failed ? [el("span", { className: "track-status", textContent: "Search failed", title: "The search failed twice, so this song might still be on Rockbot" })] : [])
            ]);
        }

        const SPOTIFY_PLAYLIST_LINK = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(?:embed\/)?playlist\/[A-Za-z0-9]{22}|spotify:playlist:[A-Za-z0-9]{22}/i;

        // Only this many playlist searches run at once, to go easy on Rockbot
        const PLAYLIST_SEARCH_CONCURRENCY = 3;

        /** Runs worker over items with at most `limit` running at once. Stops starting new ones once shouldStop() is true */
        async function runWithConcurrency(items, limit, worker, shouldStop = () => false) {
            let next = 0;
            const runner = async () => {
                while (next < items.length && !shouldStop()) {
                    const index = next++;
                    await worker(items[index], index);
                }
            };

            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, runner));
        }

        function playlistHeading(playlist) {
            const title = `${playlist.name}${playlist.owner ? ` by ${playlist.owner}` : ""}`;
            const note = playlist.mayBeTruncated ? ` Spotify only shared the first ${playlist.tracks.length} tracks, so this playlist may have more.` : "";
            return el("div", { className: "playlist-heading" }, [
                el("h2", { textContent: title }),
                el("p", { textContent: `${playlist.tracks.length} tracks.${note}` })
            ]);
        }

        // A playlist track while its search is waiting, running or finished
        function playlistTrackRow(track) {
            const status = el("span", { className: "track-status" });
            const row = el("li", { className: "song" }, [
                songCover({}),
                el("div", { className: "meta" }, [
                    el("div", { className: "title-row" }, [el("div", { className: "name", textContent: track.title })]),
                    el("div", { className: "artist", textContent: track.artist })
                ]),
                status
            ]);

            const setState = state => {
                const labels = { waiting: "Waiting", found: "✓", missing: "Not found", failed: "Search failed" };
                const spinner = label => el("div", { className: "spinner small", ariaLabel: label });

                if (state === "searching") status.replaceChildren(spinner("Searching"));
                else if (state === "retrying") status.replaceChildren("Retrying ", spinner("Retrying"));
                else status.replaceChildren(labels[state]);
                status.dataset.state = state;
            };

            setState("waiting");
            return { row, setState };
        }

        /** Finds a playlist track's Rockbot song on the server, which also tries the artist alone if needed. Null means not on Rockbot */
        async function fetchMatch(track, venue) {
            const response = await fetch(`/api/match?${new URLSearchParams({ title: track.title, artist: track.artist, venue })}`);
            const data = await response.json().catch(() => null);

            if (!response.ok) throw new Error(data?.error ?? `Search failed (${response.status})`);
            return data.match;
        }

        async function showSpotifyPlaylist(link, venue, id) {
            const isCurrent = () => id === searchId;

            try {
                const response = await fetch(`/api/spotify-playlist?${new URLSearchParams({ url: link })}`);
                const playlist = await response.json().catch(() => null);

                if (!isCurrent()) return;
                if (!response.ok) throw new Error(playlist?.error ?? `Couldn't read that playlist (${response.status})`);

                const heading = playlistHeading(playlist);
                const progress = el("p", { className: "playlist-progress" });
                const rows = playlist.tracks.map(playlistTrackRow);
                const matches = new Array(playlist.tracks.length).fill(null);
                let finished = 0;

                const updateProgress = () => progress.textContent = `Finding songs on Rockbot: ${finished} of ${playlist.tracks.length}`;
                updateProgress();
                output.replaceChildren(heading, progress, el("ul", { className: "results" }, rows.map(({ row }) => row)));

                const failed = new Array(playlist.tracks.length).fill(false);

                // A failed search is retried once; if it fails again the track is marked failed and the rest carry on
                await runWithConcurrency(playlist.tracks, PLAYLIST_SEARCH_CONCURRENCY, async (track, i) => {
                    rows[i].setState("searching");

                    try {
                        try {
                            matches[i] = await fetchMatch(track, venue);
                        } catch {
                            rows[i].setState("retrying");
                            matches[i] = await fetchMatch(track, venue);
                        }

                        rows[i].setState(matches[i] ? "found" : "missing");
                    } catch {
                        failed[i] = true;
                        rows[i].setState("failed");
                    }

                    finished++;
                    updateProgress();
                }, () => !isCurrent());

                if (!isCurrent()) return;

                // Top match per track in playlist order, each song once; grouping then takes priority over this order
                const seen = new Set();
                const songs = [];
                const notFound = [];

                playlist.tracks.forEach((track, i) => {
                    const match = matches[i];
                    if (!match) notFound.push({ ...track, failed: failed[i] });
                    else if (!seen.has(match.id)) {
                        seen.add(match.id);
                        songs.push(match);
                    }
                });

                renderResults(songs, venue, { heading, notFound });
            } catch (error) {
                if (isCurrent()) showMessage(error.message || "Couldn't read that playlist. Please try again.");
            } finally {
                if (isCurrent()) searchBtn.disabled = false;
            }
        }

        /** One Rockbot search, cached on the server for both venues */
        async function fetchSearchResults(query, venue) {
            const response = await fetch(`/api/search?${new URLSearchParams({ q: query, venue })}`);
            const data = await response.json().catch(() => null);

            if (!response.ok) throw new Error(data?.error ?? `Search failed (${response.status})`);
            return data;
        }

        async function search(query) {
            query = query.trim();
            if (!query) return;

            // Searching needs an approved UCI account; the query comes back with them after signing in
            if (!currentUser || !currentUser.approved) {
                goToLogin(`/?${new URLSearchParams({ q: query, venue: getVenue() })}`);
                return;
            }

            const venue = getVenue();
            const id = ++searchId;
            lastQuery = query;
            main.classList.add("has-results");
            searchBtn.disabled = true;
            output.replaceChildren(el("div", { className: "message" }, [el("div", { className: "spinner" })]));

            // A pasted Spotify playlist link finds each of its tracks instead
            if (SPOTIFY_PLAYLIST_LINK.test(query)) {
                await showSpotifyPlaylist(query, venue, id);
                return;
            }

            try {
                const results = await fetchSearchResults(query, venue);

                // Ignore stale responses if another search started while this one was loading
                if (id !== searchId) return;

                renderResults(results, venue);
            } catch (error) {
                if (id === searchId) showMessage(error.message || "Something went wrong. Please try again.");
            } finally {
                if (id === searchId) searchBtn.disabled = false;
            }
        }

        async function boostSong(song, venue, button, error) {
            error.textContent = "";
            setButtonBusy(button, "Boosting…");

            try {
                const { response, data } = await postJson("/api/boost", { pickId: song.pickId, songId: song.id, venue });

                if (response.status === 404) {
                    button.classList.remove("busy");
                    button.textContent = "Not in queue";
                    error.textContent = data?.error ?? "";
                    return;
                }

                if (!response.ok) throw new Error(data?.error ?? `Request failed (${response.status})`);

                button.classList.remove("busy", "boost");
                button.classList.add("done");
                button.textContent = "Boosted ✓";
                button.title = voteSummary(data);
                if (data.missing?.length) error.textContent = `Boosted, but ${data.missing.length} vote${data.missing.length === 1 ? "" : "s"} didn't go through.`;
            } catch (err) {
                error.textContent = err.message || "Could not boost this song";
                button.classList.remove("busy");
                button.textContent = "Boost";
                button.disabled = false;
            }
        }

        // A button showing a spinner and what's happening, e.g. "Queuing…"
        function setButtonBusy(button, label) {
            button.disabled = true;
            button.classList.add("busy");
            button.replaceChildren(el("span", { className: "spinner small" }), label);
        }

        const voteSummary = votes => votes.confirmed === null
            ? `${votes.requested} vote${votes.requested === 1 ? "" : "s"} sent (couldn't confirm them)`
            : `${votes.confirmed} of ${votes.requested} votes confirmed`;

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return { response, data: await response.json().catch(() => null) };
        }

        async function queueSong(song, venue, button, error, titleRow) {
            error.textContent = "";
            setButtonBusy(button, "Queuing…");

            // Step 1: request the song
            let pick;

            try {
                const { response, data } = await postJson("/api/queue", {
                    song: { id: song.id, name: song.name, artist: song.artist, cover: song.cover },
                    venue
                });

                if (response.status === 409) {
                    button.classList.remove("busy");
                    button.textContent = "Played recently";
                    error.textContent = data?.error ?? "";
                    return;
                }

                if (!response.ok) throw new Error(data?.error ?? `Request failed (${response.status})`);
                pick = data;
            } catch (err) {
                error.textContent = err.message || "Could not queue song";
                button.classList.remove("busy");
                button.textContent = "Queue";
                button.disabled = false;
                return;
            }

            // The song is in the queue now, whatever happens with the votes
            titleRow.querySelector(".badge")?.remove();
            titleRow.append(queuedBadge(pick.queuedAt ?? Date.now()));

            // Step 2: upvote it with every account and check the votes landed
            setButtonBusy(button, "Voting…");

            try {
                const { response, data } = await postJson("/api/vote", { pickId: pick.id, venue, song: { name: song.name, artist: song.artist } });
                if (!response.ok) throw new Error(data?.error ?? `Voting failed (${response.status})`);

                button.title = voteSummary(data);
                if (data.missing?.length) error.textContent = `Queued, but ${data.missing.length} vote${data.missing.length === 1 ? "" : "s"} didn't go through.`;
            } catch (err) {
                error.textContent = `Queued, but voting failed: ${err.message || "please try again"}`;
            }

            button.classList.remove("busy");
            markButtonQueued(button);
        }

        function formatTime(seconds) {
            const total = Math.max(0, Math.round(seconds));
            return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
        }

        function queueRow(entry, extraClass = "") {
            const titleRow = el("div", { className: "title-row" }, [
                el("div", { className: "name", textContent: entry.name || "Unknown song" })
            ]);

            if (entry.zotify) titleRow.append(el("span", { className: "badge", textContent: "Zotify", title: "Queued with Zotify" }));

            const row = el("li", { className: `song ${extraClass} ${entry.zotify ? "zotify" : ""}` }, [
                votableCover(entry, getVenue()),
                songBackdrop(entry),
                el("div", { className: "meta" }, [
                    titleRow,
                    el("div", { className: "artist", textContent: entry.artist })
                ])
            ]);

            // Votes can be missing if Rockbot didn't return them for this song
            if (entry.upvotes !== undefined && entry.downvotes !== undefined) row.append(voteWidget(entry));

            return row;
        }

        function voteWidget({ upvotes, downvotes }) {
            const label = `${upvotes} upvote${upvotes === 1 ? "" : "s"}, ${downvotes} downvote${downvotes === 1 ? "" : "s"}`;

            return el("div", { className: "votes", title: label, ariaLabel: label, role: "img" }, [
                el("span", { className: `vote up ${upvotes ? "active" : ""}`, textContent: `▲ ${upvotes}` }),
                el("span", { className: `vote down ${downvotes ? "active" : ""}`, textContent: `▼ ${downvotes}` })
            ]);
        }

        function nowPlayingRow(entry) {
            const row = queueRow(entry, "now-playing");
            clearInterval(nowPlayingTimer);

            if (entry.duration && entry.secondsRemaining !== undefined) {
                const fill = el("div", { className: "progress-fill" });
                const elapsedLabel = el("span");
                const remainingLabel = el("span");
                const endsAt = Date.now() + entry.secondsRemaining * 1000;

                const tick = () => {
                    const remaining = Math.max(0, (endsAt - Date.now()) / 1000);
                    fill.style.width = `${((entry.duration - remaining) / entry.duration) * 100}%`;
                    elapsedLabel.textContent = formatTime(entry.duration - remaining);
                    remainingLabel.textContent = `-${formatTime(remaining)}`;
                };

                tick();
                nowPlayingTimer = setInterval(tick, 1000);

                row.append(el("div", { className: "progress-row" }, [
                    elapsedLabel,
                    el("div", { className: "progress", role: "progressbar", ariaLabel: "Song progress" }, [fill]),
                    remainingLabel
                ]));
            }

            return row;
        }

        function queueGroup(title, children) {
            return el("div", { className: "queue-group" }, [el("h3", { textContent: title }), ...children]);
        }

        async function loadQueue({ quiet = false } = {}) {
            const venue = getVenue();
            const id = ++queueId;
            document.getElementById("recent-title").textContent = `Up next at ${getVenueLabel()}`;

            if (!quiet) {
                clearInterval(nowPlayingTimer);
                recentList.replaceChildren(el("div", { className: "message" }, [el("div", { className: "spinner" })]));
            }

            try {
                const response = await fetch(`/api/venue-queue?${new URLSearchParams({ venue })}`);
                const data = await response.json().catch(() => null);

                // Ignore stale responses if the venue changed or another load started
                if (id !== queueId) return;

                if (!response.ok) throw new Error(data?.error ?? `Could not load the queue (${response.status})`);

                const groups = [];

                if (data.nowPlaying) groups.push(queueGroup("Now playing", [el("ul", { className: "results" }, [nowPlayingRow(data.nowPlaying)])]));
                else clearInterval(nowPlayingTimer);

                if (data.onDeck.length) groups.push(queueGroup("On deck", [el("ul", { className: "results" }, data.onDeck.map(entry => queueRow(entry)))]));
                if (data.comingUp.length) groups.push(queueGroup("Coming up", [el("ul", { className: "results" }, data.comingUp.map(entry => queueRow(entry)))]));

                if (!groups.length) {
                    showMessage(`Nothing is playing at ${getVenueLabel()} right now.`, recentList);
                    return;
                }

                recentList.replaceChildren(...groups);
            } catch (error) {
                // Keep showing the last queue if a background refresh fails
                if (id === queueId && !quiet) showMessage(error.message || "Could not load the queue", recentList);
            }
        }

        const isHome = () => !main.classList.contains("has-results");

        setInterval(() => {
            if (isHome() && !document.hidden) loadQueue({ quiet: true });
        }, QUEUE_REFRESH_MS);

        document.addEventListener("visibilitychange", () => {
            if (isHome() && !document.hidden) loadQueue({ quiet: true });
        });

        function goHome() {
            searchId++;
            lastQuery = "";
            searchBtn.disabled = false;
            main.classList.remove("has-results");
            output.replaceChildren();
            queryInput.value = "";
            queryInput.focus();
            loadQueue();
        }

        form.addEventListener("submit", event => {
            event.preventDefault();
            search(queryInput.value);
        });

        document.getElementById("home-link").addEventListener("click", event => {
            event.preventDefault();
            goHome();
        });

        document.querySelectorAll('input[name="venue"]').forEach(input => {
            input.addEventListener("change", () => {
                if (main.classList.contains("has-results") && lastQuery) {
                    search(lastQuery);
                } else {
                    loadQueue();
                }
            });
        });

        loadQueue();

        // Signing in

        let currentUser = null;

        // Signed-out people sign in; signed-in people who aren't approved yet see the private beta screen
        function goToLogin(next = location.pathname + location.search) {
            const page = currentUser && !currentUser.approved ? "/beta" : "/login";
            location.assign(`${page}?${new URLSearchParams({ next })}`);
        }

        // A locked route answering 401 means the session ended, and 403 means they aren't approved (anymore)
        const pageFetch = window.fetch.bind(window);
        window.fetch = async (url, options) => {
            const response = await pageFetch(url, options);
            const path = String(url);
            const locked = path.startsWith("/api/") && !path.startsWith("/api/auth/") && !path.startsWith("/api/admin/");

            if (locked && response.status === 401) {
                currentUser = null;
                goToLogin();
            } else if (locked && response.status === 403 && (await response.clone().json().catch(() => null))?.notApproved) {
                currentUser = { ...currentUser, approved: false };
                goToLogin();
            }

            return response;
        };

        function renderAccount() {
            const account = document.getElementById("account");

            if (!currentUser) {
                const signIn = el("a", { className: "account-link", href: "/login", textContent: "Sign in" });
                signIn.addEventListener("click", event => {
                    event.preventDefault();
                    goToLogin();
                });
                account.replaceChildren(signIn);
                return;
            }

            const signOut = el("button", { type: "button", className: "account-link", textContent: "Sign out" });
            signOut.addEventListener("click", async () => {
                await postJson("/api/auth/logout", {}).catch(() => {});
                currentUser = null;
                renderAccount();
                goHome();
            });
            // UCI accounts show just their UCInetID; other email addresses show in full
            const netId = currentUser.email.replace(/@uci\.edu$/i, "");
            const admin = currentUser.admin ? [el("a", { className: "account-link", href: "/admin", textContent: "Admin" })] : [];
            const join = currentUser.approved ? [] : [el("a", { className: "account-link", href: "/beta", textContent: "Join" })];
            const picks = currentUser.approved ? [el("a", { className: "account-link", href: "/my-picks", textContent: "My picks" })] : [];
            account.replaceChildren(el("span", { className: "account-email", textContent: netId, title: currentUser.email }), ...picks, ...admin, ...join, signOut);
        }

        async function loadAccount() {
            try {
                const response = await fetch("/api/auth/me");
                currentUser = response.ok ? await response.json() : null;
            } catch {
                currentUser = null;
            }

            renderAccount();

            // Pick up a search someone started before signing in
            const params = new URLSearchParams(location.search);
            const pendingQuery = params.get("q");

            // Just let in by an invite link, magic link or code
            if (params.has("welcome")) {
                history.replaceState(null, "", location.pathname);
                if (currentUser?.approved) showWelcome();
            }

            if (pendingQuery) {
                history.replaceState(null, "", location.pathname);
                const venueInput = document.querySelector(`input[name="venue"][value="${params.get("venue")}"]`);
                if (venueInput) venueInput.checked = true;

                if (currentUser) {
                    queryInput.value = pendingQuery;
                    search(pendingQuery);
                }
            }
        }

        function showWelcome() {
            const note = el("div", { className: "welcome-note", role: "status", textContent: "You're in! Welcome to Zotify." });
            document.body.append(note);
            setTimeout(() => note.remove(), 5000);
        }

        loadAccount();
    </script>
</body>
</html>
